  -  name: Install Caddy
     ansible.builtin.get_url:
       url: https://caddyserver.com/api/download?os=linux&arch=amd64
       dest: /usr/bin/caddy
       mode: '0755'

  -  name: Create Caddy user and group
     ansible.builtin.user:
       name: {{ app_user }}


  -  name: Import App Pre Requisites
     ansible.builtin.import_role:
       name: common
       tasks_from: app-pre-req


  -  name: Copy Caddy config file
     ansible.builtin.template:
       src: Caddyfile
       dest: "{{app_loc}}/Caddyfile"

  -  name: Create Caddy systemd service file
     ansible.builtin.template:
       src: caddy.service
       dest: /etc/systemd/system/caddy.service


  -  name: Enable and restart Caddy service
     ansible.builtin.systemd_service:
       name: caddy
       enabled: true
       state: restarted
       deamon_reload: true